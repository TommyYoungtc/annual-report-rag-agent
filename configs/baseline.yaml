project:
  name: annual-report-agent
  seed: 42

chunking:
  max_chars: 900
  overlap_chars: 120
  min_chars: 80

retrieval:
  top_k: 5
  bm25:
    k1: 1.5
    b: 0.75
  rrf:
    rank_constant: 60

models:
  embedding:
    name: Qwen/Qwen3-Embedding-0.6B
    max_length: 768
    batch_size: 4
    device: cuda
    query_instruction: "Given a Chinese annual report question, retrieve passages that directly support the answer."
  reranker:
    name: Qwen/Qwen3-Reranker-0.6B
    max_length: 1024
    batch_size: 1
    device: cuda

